<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMatch Portalı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #f4f6f9; --panel-bg: #ffffff; --text-color: #333333; --primary-color: #ff4b4b; --premium-color: #1da1f2; --border-color: #e1e8ed; --brand-color: #8e44ad; }
        [data-theme="dark"] { --bg-color: #15202b; --panel-bg: #1e2732; --text-color: #ffffff; --border-color: #38444d; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; transition: background-color 0.3s, color 0.3s; display: flex; flex-direction: column; min-height: 100vh;}

        /* --- UI KOMPONENTLƏR --- */
        .auth-container { display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; }
        .auth-box { background: var(--panel-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;}
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .navbar { background: var(--panel-bg); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .nav-center { display: flex; gap: 10px; }
        .nav-item { color: var(--text-color); text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 5px 10px; border-radius: 6px; font-size: 14px;}
        .nav-item.active { background: var(--bg-color); color: var(--primary-color); }
        .badge { position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; background-color: var(--primary-color); border-radius: 50%; display: none; }
        .content-wrapper { display: flex; max-width: 1200px; margin: 20px auto; gap: 20px; padding: 0 15px; flex: 1; width: 100%; box-sizing: border-box;}
        .left-panel, .right-panel { width: 250px; background: var(--panel-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .center-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .box-panel { background: var(--panel-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .avatar-round { width: 40px; height: 40px; border-radius: 50%; background-color: #ccc; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; object-fit: cover; overflow: hidden; flex-shrink: 0;}
        .avatar-small { width: 30px; height: 30px; border-radius: 50%; background-color: var(--primary-color); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; overflow: hidden; flex-shrink: 0;}
        .post { background: var(--panel-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 10px;}
        .chat-container { display: flex; height: 75vh; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .site-footer { text-align: center; padding: 20px; font-size: 12px; color: #888; border-top: 1px solid var(--border-color); margin-top: 20px;}
        
        /* Stiker Paneli - YENİLƏNMİŞ */
        .sticker-picker { display: none; position: absolute; bottom: 80px; left: 45px; background: var(--panel-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 260px; max-height: 250px; overflow-y: auto; z-index: 100;}
        .sticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;}
        .sticker-grid video { width: 100%; height: 60px; cursor: pointer; border-radius: 4px; background: #eee; object-fit: contain;}
    </style>
</head>
<body>

    <div id="auth-section" class="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">Sayta Giriş</h2>
            <div id="login-form">
                <input type="text" id="login-username" placeholder="İstifadəçi adı">
                <input type="password" id="login-password" placeholder="Parol">
                <button class="btn" onclick="processLogin()">Daxil ol</button>
                <div class="auth-links"><a onclick="toggleAuth('register')">Qeydiyyat</a></div>
            </div>
            <div id="register-form" style="display: none;">
                <input type="text" id="reg-name" placeholder="Ad Soyad">
                <input type="text" id="reg-username" placeholder="İstifadəçi adı">
                <input type="password" id="reg-password" placeholder="Parol">
                <button class="btn" onclick="validateRegistration()">Qeydiyyat</button>
            </div>
        </div>
    </div>

    <div id="main-section" style="display: none; flex: 1; display: flex; flex-direction: column;">
        <nav class="navbar">
            <div class="nav-logo"><h2><i class="fas fa-heart" style="color: var(--brand-color);"></i> VibeMatch</h2></div>
            <div class="nav-center">
                <a class="nav-item active" onclick="switchView('feed')"><i class="fas fa-home"></i> Ana</a>
                <a class="nav-item" onclick="switchView('dating')"><i class="fas fa-user-friends"></i> Tanışlıq</a>
                <a class="nav-item" onclick="switchView('messages')"><i class="fas fa-envelope"></i> Mesaj</a>
                <a class="nav-item" onclick="switchView('guests')"><i class="fas fa-eye"></i> Qonaqlar</a>
                <a class="nav-item" onclick="switchView('notifications')"><i class="fas fa-bell"></i></a>
            </div>
            <div class="nav-right">
                <a class="nav-item" onclick="switchView('profile')" style="display:flex; align-items:center; gap:8px;">
                    <div class="avatar-small" id="nav-profile-img"></div>
                    <span id="nav-profile-name"></span>
                </a>
            </div>
        </nav>

        <div class="content-wrapper">
            <aside class="left-panel"><h3>Onlayn</h3><ul id="online-users-list"></ul></aside>
            <main class="center-panel">
                <div id="view-feed" class="view-section active-view"><div id="feed-container"></div></div>
                <div id="view-profile" class="view-section"><div id="profile-container"></div></div>
                <div id="view-guests" class="view-section"><div class="box-panel"><h3>Qonaqlar</h3><ul id="guests-list"></ul></div></div>
                <div id="view-notifications" class="view-section"><div class="box-panel"><h3>Bildirişlər</h3><ul id="notifications-list"></ul></div></div>
                <div id="view-messages" class="view-section"><div id="chat-container"></div></div>
                <div id="view-external-profile" class="view-section"><div id="ext-profile-content"></div></div>
            </main>
            <aside class="right-panel"><h3>İzlədiklərim</h3><ul id="following-list"></ul></aside>
        </div>
        <div class="site-footer">© Sayt Elman Hüseynov tərəfindən yaradılmışdır.</div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('vb_users') || "{}");
        let currentUser = localStorage.getItem('vb_username');
        let chatHistories = JSON.parse(localStorage.getItem('vb_chats') || "{}");

        // 1. Profil Navbar Update
        function updateNavbar() {
            if(currentUser && users[currentUser]) {
                document.getElementById('nav-profile-name').innerText = users[currentUser].fullname;
                if(users[currentUser].avatar) {
                    document.getElementById('nav-profile-img').innerHTML = `<img src="${users[currentUser].avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                } else {
                    document.getElementById('nav-profile-img').innerText = users[currentUser].fullname.charAt(0);
                }
            }
        }

        // 2. İzləmə İstəyi
        function sendFollowRequest(target) {
            alert(target + " üçün istək göndərildi!");
            // Bildirişlər üçün sadə obyekt
            let notif = { from: currentUser, action: 'follow_req' };
            localStorage.setItem('notif_' + target, JSON.stringify(notif));
            renderNotifications();
        }

        function renderNotifications() {
            let list = document.getElementById('notifications-list');
            list.innerHTML = '';
            let notif = localStorage.getItem('notif_' + currentUser);
            if(notif) {
                let data = JSON.parse(notif);
                list.innerHTML = `<li>${data.from} səni izləmək istəyir. 
                    <button onclick="acceptFollow('${data.from}')">Qəbul et</button></li>`;
            }
        }

        function acceptFollow(follower) {
            let following = JSON.parse(localStorage.getItem('following_' + currentUser) || "[]");
            following.push(follower);
            localStorage.setItem('following_' + currentUser, JSON.stringify(following));
            alert("İstək qəbul edildi!");
        }

        // 3. Qonaqlar
        function addGuest(target) {
            if(target === currentUser) return;
            let guests = JSON.parse(localStorage.getItem('guests_' + target) || "[]");
            if(!guests.includes(currentUser)) {
                guests.push(currentUser);
                localStorage.setItem('guests_' + target, JSON.stringify(guests));
            }
        }

        function renderGuests() {
            let list = document.getElementById('guests-list');
            let guests = JSON.parse(localStorage.getItem('guests_' + currentUser) || "[]");
            list.innerHTML = guests.map(g => `<li onclick="openExternalProfile('${g}')">${g}</li>`).join('');
        }

        // 4. Stikerlər (WebM optimallaşdırılmış)
        const customStickers = Array.from({length: 45}, (_, i) => `stikerler/${i+1}.webm`);

        function loadCustomStickers() {
            let resultsDiv = document.getElementById('sticker-results');
            if(resultsDiv.innerHTML !== '') return;
            customStickers.forEach(src => {
                resultsDiv.innerHTML += `
                    <video src="${src}#t=0.001" loop muted 
                           onmouseover="this.play()" onmouseout="this.pause()" 
                           onclick="sendSticker('${src}')"></video>`;
            });
        }

        // --- AUTH ---
        function processLogin() {
            let u = document.getElementById('login-username').value;
            if(users[u]) {
                localStorage.setItem('vb_LoggedIn', 'true');
                localStorage.setItem('vb_username', u);
                location.reload();
            } else alert("İstifadəçi tapılmadı!");
        }

        function validateRegistration() {
            let u = document.getElementById('reg-username').value;
            users[u] = { fullname: document.getElementById('reg-name').value, password: document.getElementById('reg-password').value };
            localStorage.setItem('vb_users', JSON.stringify(users));
            alert("Qeydiyyat uğurlu!");
            location.reload();
        }

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
            document.getElementById('view-' + viewName).classList.add('active-view');
            if(viewName === 'guests') renderGuests();
        }

        // Başqasının profilinə girəndə qonaqlara əlavə et
        function openExternalProfile(username) {
            addGuest(username);
            switchView('external-profile');
            // ... (Profil render mantığı)
        }

        updateNavbar();
        loadCustomStickers();
    </script>
</body>
</html>
